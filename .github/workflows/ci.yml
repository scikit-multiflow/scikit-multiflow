name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: Python 3.5 on Linux
            os: ubuntu-22.04
            python_version: '3.5'
            travis_os_name: linux
            travis_python_version: '3.5'
          - name: Python 3.6 on Linux
            os: ubuntu-22.04
            python_version: '3.6'
            travis_os_name: linux
            travis_python_version: '3.6'
          - name: Python 3.7 on Xenial Linux
            os: ubuntu-22.04
            python_version: '3.7'
            travis_os_name: linux
            travis_python_version: '3.7'
          - name: Python 3.7.4 on macOS
            os: macos-14
            python_version: '3.7.4'
            travis_os_name: osx
            travis_python_version: ''
    env:
      TRAVIS_OS_NAME: ${{ matrix.travis_os_name }}
      TRAVIS_PYTHON_VERSION: ${{ matrix.travis_python_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
      - run: |
          if [[ "$TRAVIS_OS_NAME" != "windows" ]];
          then pip3 install --upgrade pip setuptools wheel;
          fi
      - run: |
          if [[ $TRAVIS_PYTHON_VERSION != '3.8' ]];
          then pip3 install --only-binary=numpy,scipy numpy scipy;
          else pip3 install numpy scipy;
          fi
      - run: pip3 install codecov pytest-cov cython
      - run: pip3 install -U .
      - run: pytest tests --showlocals -v --cov=skmultiflow
      - run: codecov

  windows:
    name: Python 3.7.4 on Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      PATH: /c/Python37:/c/Python37/Scripts:$PATH
      TRAVIS_OS_NAME: windows
      TRAVIS_PYTHON_VERSION: ''
    steps:
      - uses: actions/checkout@v4
      - run: choco install python --version 3.7.4
      - run: python -m pip install --upgrade pip
      - run: |
          if [[ "$TRAVIS_OS_NAME" != "windows" ]];
          then pip3 install --upgrade pip setuptools wheel;
          fi
      - run: |
          if [[ $TRAVIS_PYTHON_VERSION != '3.8' ]];
          then pip3 install --only-binary=numpy,scipy numpy scipy;
          else pip3 install numpy scipy;
          fi
      - run: pip3 install codecov pytest-cov cython
      - run: pip3 install -U .
      - run: pytest tests --showlocals -v --cov=skmultiflow
      - run: codecov